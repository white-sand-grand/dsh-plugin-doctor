# Bundle patch for `dsh-plugin-recommender`. Mounting this bundle adds the
# plugin's tool row with its default configuration; every value here is also
# overridable from the profile's own patch layer or the settings namespace.
- insert:
    - id: plugin-recommender
      name: dsh-plugin-recommender
      config:
        githubTokenEnv: DSH_PLUGIN_RECOMMENDER_GITHUB_TOKEN
        similarityThreshold: 0.8
        cacheTtlMinutes: 30
        enableRegistryFallback: true
